<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnologia - Santana Tech</title>
    <style>
        :root {
            --bg-color: #0d0b14;
            --card-bg: #161224;
            --primary-purple: #8A2BE2;
            --accent-purple: #9d4edd;
            --text-color: #e0e0e0;
            --text-muted: #a099b5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }

        header { background-color: var(--card-bg); border-bottom: 2px solid var(--primary-purple); position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
        .logo { font-size: 1.8rem; font-weight: bold; color: #fff; text-decoration: none; }
        .logo span { color: var(--accent-purple); }

        nav ul { display: flex; list-style: none; gap: 1.5rem; }
        nav a { color: var(--text-color); text-decoration: none; font-weight: 500; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--accent-purple); }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 2.5fr 1fr; gap: 2rem; }
        
        .page-title { margin-bottom: 1.5rem; border-left: 4px solid var(--primary-purple); padding-left: 1rem; color: #fff; }

        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .tech-card { background-color: var(--card-bg); border-radius: 8px; padding: 1.5rem; border: 1px solid rgba(138, 43, 226, 0.2); transition: transform 0.3s; }
        .tech-card:hover { transform: translateY(-5px); border-color: var(--accent-purple); }
        .tech-card h3 { color: var(--accent-purple); margin-bottom: 0.8rem; }
        
        aside { display: flex; flex-direction: column; gap: 1.5rem; }
        .widget { background-color: var(--card-bg); padding: 1.5rem; border-radius: 8px; border-left: 4px solid var(--primary-purple); }
        .widget-title { font-size: 1.1rem; color: #fff; margin-bottom: 1rem; text-transform: uppercase; }

        footer { background-color: var(--card-bg); border-top: 1px solid rgba(138, 43, 226, 0.3); text-align: center; padding: 2rem; margin-top: 3rem; color: var(--text-muted); }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="inicio.html" class="logo">Santana<span>Tech</span></a>
            <nav>
                <ul>
                    <li><a href="inicio.html">Início</a></li>
                    <li><a href="tecnologia.html" class="active">Tecnologia</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div
